services:
  postgres:
    # Imagen propia: copia los scripts de init DENTRO de la imagen (ver postgres/Dockerfile).
    # Evita el bind mount relativo, que en Coolify puede llegar vacio al contenedor.
    build:
      context: ./postgres
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      # Superusuario: solo inicializa la BD y ejecuta el healthcheck.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: finanzas
      # Rol de aplicacion (minimo privilegio) que usa el backend.
      APP_DB_USER: finanzas
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
 
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      APP_ENV: production
      # El healthcheck y el Dockerfile deben usar este mismo puerto.
      PORT: '4000'
      # APP_DB_PASSWORD debe ser alfanumerica (openssl rand -hex 24) para no romper esta URL.
      DATABASE_URL: postgresql://finanzas:${APP_DB_PASSWORD:?define APP_DB_PASSWORD}@postgres:5432/finanzas
      CORS_ORIGIN: ${CORS_ORIGIN:?define CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      # El backend solo es accesible desde la red interna del compose.
      FORWARDED_ALLOW_IPS: '*'
      # Fijados a false: no pueden activarse por error desde las variables de Coolify.
      DEMO_SEED_ENABLED: 'false'
      SEED_FORCE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Prueba curl, luego wget y por ultimo python, para no depender de una sola herramienta.
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:4000/api/health
          || wget -q -O /dev/null http://127.0.0.1:4000/api/health
          || python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
 
  web:
    build:
      context: ./frontend
      args:
        # Se incrusta al construir. Cambiarla exige reconstruir la imagen.
        VITE_API_URL: /api
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    # En Coolify asigna el dominio a ESTE servicio con el puerto interno:
    # https://tudominio.com:8080
    expose:
      - '8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
 
volumes:
  postgres_data:
