services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finanzas}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Mismo usuario con el que se inicializa el volumen: una sola credencial.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-finanzas}
      DB_USER: ${POSTGRES_ADMIN_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:?define CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      # Blockchain: vacios = seccion desactivada. Activa solo con el perfil 'blockchain'.
      RPC_URL: ${RPC_URL:-}
      CHAIN_ID: ${CHAIN_ID:-31337}
      PAYMENT_CONTRACT_ADDRESS: ${PAYMENT_CONTRACT_ADDRESS:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:-}
      INDEXER_INTERVAL: ${INDEXER_INTERVAL:-5}
    depends_on:
      - postgres

  # Nodo EVM local (Anvil): solo con `docker compose --profile blockchain up`.
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.9.0
    profiles: ["blockchain"]
    restart: unless-stopped
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    expose:
      - '8545'

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Coolify asigna el dominio a este puerto interno del contenedor.
    expose:
      - '8080'
    # Healthcheck solo en web: es el servicio que recibe trafico y arranca en segundos.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - coolify

volumes:
  postgres_data:

networks:
  # Red del proxy de Coolify: el dominio entra por aqui hasta 'web'.
  coolify:
    external: true
