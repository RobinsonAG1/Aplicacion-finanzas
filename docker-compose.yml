services:
  postgres:
    # Digest fijado (multi-arch) para builds reproducibles. Actualizar de forma consciente.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      # Superusuario: solo inicializa la BD y ejecuta el healthcheck.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finanzas}
      # Rol de aplicacion (minimo privilegio) que usa el backend.
      APP_DB_USER: ${APP_DB_USER:-finanzas}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Socket local compartido: permite a postgres-init entrar por el socket
      # (autenticacion trust) sin depender de la contrasena del volumen.
      - pg_socket:/var/run/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres-init:
    # Tarea de un solo uso: crea/actualiza los roles en CADA despliegue.
    # El directorio initdb.d solo se ejecuta con el volumen vacio, asi que un
    # volumen ya inicializado (o un APP_DB_PASSWORD cambiado) se quedaria sin rol
    # valido. Entra por el socket local del contenedor postgres (trust), por lo
    # que funciona aunque la contrasena del volumen no coincida con la del entorno.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGSOCKET_DIR: /var/run/postgresql
      PGPORT: '5432'
      # Fallback por TCP si el socket local no estuviera disponible.
      PGHOST: postgres
      # PGPASSWORD solo se usa si el socket exigiera contrasena (configuracion
      # alternativa de initdb); con trust se ignora.
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finanzas}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-finanzas}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD}
    volumes:
      - pg_socket:/var/run/postgresql
      - ./postgres/init:/init:ro
    # Se invoca con sh explicito: no depende del bit de ejecucion en git.
    entrypoint: ['/bin/sh', '-c', 'sh /init/01-app-role.sh']
    restart: 'no'
    networks:
      - default

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      APP_ENV: production
      PORT: '4000'
      # La URL se construye en el entrypoint con URL-encoding: una contrasena con
      # caracteres especiales (@ : / #) no puede romper el DSN. Si se define
      # DATABASE_URL explicitamente, esa tiene prioridad.
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-finanzas}
      DB_USER: ${APP_DB_USER:-finanzas}
      DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD}
      # Origen publico exacto: se usa para CORS y para la validacion CSRF de refresh/logout.
      CORS_ORIGIN: ${CORS_ORIGIN:?define CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET}
      # TTL en segundos.
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # Seed de demostracion (no destructivo): solo crea la cuenta demo si no existe.
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      SEED_FORCE: ${SEED_FORCE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    # Solo alcanzable por nombre de servicio desde la red interna.
    expose:
      - '4000'
    networks:
      - default
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    # Coolify enruta el dominio a este puerto interno; no se publica en el host.
    expose:
      - '8080'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - coolify
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  pg_socket:

networks:
  coolify:
    external: true
