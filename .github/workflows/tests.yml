name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: silent
      JWT_ACCESS_SECRET: ci-access-secret-de-al-menos-32-caracteres-para-tests
      JWT_REFRESH_SECRET: ci-refresh-secret-de-al-menos-32-caracteres-para-tests
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas -d finanzas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Ejecutar tests de integracion
        run: pytest -q --tb=short

  frontend:
    name: Frontend · vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Ejecutar tests unitarios
        run: npm run test

  summary:
    name: Resumen de tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Publicar resultado
        run: |
          echo "| Suite | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend · pytest | ${{ needs.backend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend · vitest | ${{ needs.frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            exit 1
          fi
