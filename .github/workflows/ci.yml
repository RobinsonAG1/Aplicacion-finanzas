name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint · types · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: silent
      JWT_ACCESS_SECRET: ci-access-secret-de-al-menos-32-caracteres-para-tests
      JWT_REFRESH_SECRET: ci-refresh-secret-de-al-menos-32-caracteres-para-tests
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas -d finanzas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: alembic upgrade head

      - run: ruff check app tests scripts

      - run: ruff format --check app tests scripts

      - run: mypy app scripts

      - run: pytest -q

      - run: python -m compileall -q app scripts

  frontend:
    name: Frontend · lint · types · tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

  security:
    name: Seguridad · pip audit · npm audit · Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: pip-audit (backend)
        run: pip-audit -r backend/requirements.txt

      - name: npm audit (frontend, dependencias de produccion)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      # Tag correcto: tras el ataque de supply chain (CVE-2026-33634) los tags usan el
      # prefijo "v" (v0.36.0). Se fija por SHA inmutable en lugar de por tag.
      - name: Trivy (dependencias y secretos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
