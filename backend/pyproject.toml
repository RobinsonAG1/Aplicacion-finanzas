# Solo configuracion de herramientas. Las dependencias viven en
# requirements.txt / requirements-dev.txt (pip).

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N"]
ignore = ["B008"] # Depends()/fastapi en defaults es el patron oficial

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = ["^migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
